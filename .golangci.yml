version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    depguard:
      rules:
        no-legacy-log:
          files:
            - "!**/cmd/**"
            - "!$test"
          deny:
            - pkg: log$
              desc: use log/slog
    forbidigo:
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: use structured logging; only cmd/ may print
        - pattern: InsecureSkipVerify
          msg: never disable TLS verification
    gosec:
      excludes:
        - G104 # covered by errcheck
        - G304 # file paths come from operator configuration, never from requests
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: cmd/
        linters: [forbidigo]
        text: "fmt.Print"
      - path: _test\.go
        linters: [gosec, noctx, bodyclose, contextcheck, usestdlibvars]
      - path: internal/(testutil|githubtest|pulsetest)/
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aurimasniekis/go-pulse-github
